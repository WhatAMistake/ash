name: Deploy Ash

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Aeza
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /opt/ash

            git pull --ff-only origin main

            /opt/ash/.venv/bin/pip install -r /opt/ash/requirements.txt

            sudo /usr/bin/systemctl restart ash.service
            sudo /usr/bin/systemctl is-active ash.service
